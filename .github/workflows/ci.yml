name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Record environment
        run: |
          python -VV
          python -m pip list --format=freeze
      - name: Run the test suite
        run: python -m pytest
      - name: Case-study data integrity (sha256 of the committed CSV)
        run: python -c "import hashlib,pathlib,sys;p=pathlib.Path('examples/case_study/case_study.csv');h=hashlib.sha256(p.read_bytes()).hexdigest().upper();print('CASE_STUDY_SHA256='+h);sys.exit(0 if h=='9587B66886A942EE9E9589FE65F000406F6F9F40F41BA7E7BF0B5E0CF9E942DA' else 1)"

  package:
    name: package (ubuntu-latest, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Repository text hygiene (no NUL bytes or BOM)
        run: python -c "import pathlib,subprocess,sys;fs=[f for f in subprocess.run(['git','ls-files'],capture_output=True,text=True).stdout.split() if not f.startswith('tests/fixtures/')];d={f:pathlib.Path(f).read_bytes() for f in fs};nul=[f for f in fs if 0 in d[f]];bom=[f for f in fs if d[f][:3]==bytes((239,187,191))];print('SCANNED=',len(fs));print('NUL_BYTE_FILES=',nul);print('BOM_FILES=',bom);print('SKIPPED_PREFIX=tests/fixtures/');sys.exit(1 if (nul or bom) else 0)"
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/dist" .
      - name: Verify wheel metadata and contents
        run: |
          python - <<'PY'
          import glob, os, zipfile
          dist = os.path.join(os.environ["RUNNER_TEMP"], "dist")
          wheels = sorted(glob.glob(os.path.join(dist, "*.whl")))
          assert len(wheels) == 1, wheels
          archive = zipfile.ZipFile(wheels[0])
          names = archive.namelist()
          print("WHEEL=" + os.path.basename(wheels[0]))
          print("WHEEL_FILES=" + str(len(names)))
          leaked = [n for n in names if n.startswith(("tests/", "docs/", "examples/"))]
          assert not leaked, leaked
          metadata = [n for n in names if n.endswith(".dist-info/METADATA")][0]
          text = archive.read(metadata).decode("utf-8")
          for line in text.splitlines():
              if line.startswith(("Name:", "Version:", "License-Expression:", "Requires-Python:", "Requires-Dist:", "Provides-Extra:")):
                  print(line)
          assert "License-Expression: MIT" in text
          print("WHEEL_METADATA_OK")
          PY
      - name: Install the built wheel in a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-cache-dir "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/venv/bin/python" -m pip check
          "$RUNNER_TEMP/venv/bin/modeltrust" --version
          "$RUNNER_TEMP/venv/bin/modeltrust" --help
      - name: Determinism — canonical run twice into the same out-dir
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/mt_out"
          CLI="$RUNNER_TEMP/venv/bin/modeltrust"
          snapshot() { find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum; }
          rm -rf "$OUT" && mkdir -p "$OUT"
          $CLI report --input examples/case_study/case_study.csv --target-col y --time-col ts --pred-col pred --group-col site --evaluate --shift --card --out-dir "$OUT"
          snapshot > "$RUNNER_TEMP/snap1.txt"
          test -s "$RUNNER_TEMP/snap1.txt"
          rm -rf "$OUT" && mkdir -p "$OUT"
          $CLI report --input examples/case_study/case_study.csv --target-col y --time-col ts --pred-col pred --group-col site --evaluate --shift --card --out-dir "$OUT"
          snapshot > "$RUNNER_TEMP/snap2.txt"
          cat "$RUNNER_TEMP/snap1.txt"
          diff -u "$RUNNER_TEMP/snap1.txt" "$RUNNER_TEMP/snap2.txt"
          echo "DETERMINISM_OK"