[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeltrust"
version = "0.0.1.dev0"
description = "Diagnostic audits for ML evaluation trustworthiness (research prototype)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
parquet = ["pyarrow>=16"]
ml = ["scikit-learn>=1.4"]

[project.scripts]
modeltrust = "modeltrust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
